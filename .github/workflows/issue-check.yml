name: Check linked issues
on:
  pull_request:
    types: [ edited, synchronize, opened, reopened ]

jobs:
  check-linked-issues:
    name: Check if pull request has linked issues
    runs-on: ubuntu-latest
    steps:
      - name: Create read-only App token
        id: app
        uses: actions/create-github-app-token@v3  
        with:
          client-id: ${{ vars.ISSUE_READER_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_READER_KEY }}
          owner: skalenetwork
          permission-issues: read
          permission-pull-requests: read
      - name: Get issues
        id: get-issues
        uses: mondeja/pr-linked-issues-action@15e15b5aa999ae8a742117c9489aa63b1a007b76
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      - name: PR has not linked issues
        if: join(steps.get-issues.outputs.issues) == ''
        run: 
          exit 1
