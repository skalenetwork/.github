name: CLA
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLA_BOT_KEY }}
          owner: skalenetwork
          repositories: cla-sigs
          permission-contents: write
          permission-members: read

      - id: team
        uses: actions/github-script@7a5c598405937d486b0331594b5da2b14db670da
        with:
          github-token: ${{ steps.app.outputs.token }}
          result-encoding: string
          script: |
            const m = await github.paginate(github.rest.orgs.listMembers, { org: "skalenetwork" });
            return m.map(x => x.login).join(",");

      - id: cla
        continue-on-error: ${{ vars.CLA_ENFORCE != 'true' }}   # advisory until org variable CLA_ENFORCE=true
        uses: contributor-assistant/github-action@ba066dbae3769e2ce93ec8cfc4fdc51b9db628ba
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app.outputs.token }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://skale.space/cla-txt
          remote-organization-name: skalenetwork
          remote-repository-name: cla-sigs
          branch: master
          allowlist: ${{ steps.team.outputs.result }},*[bot]
