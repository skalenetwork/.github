name: CLA
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # no checkout: this job has a secret and runs on PRs from forks
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLA_BOT_KEY }}
          owner: skalenetwork
          repositories: cla-sigs
          permission-contents: write
          permission-members: read

      - id: team
        uses: actions/github-script@7a5c598405937d486b0331594b5da2b14db670da
        with:
          github-token: ${{ steps.app.outputs.token }}
          result-encoding: string
          script: |
            const m = await github.paginate(github.rest.orgs.listMembers, { org: "skalenetwork" });
            return m.map(x => x.login).join(",");

      - id: cla
        continue-on-error: true   # action fails on its "re-run" step when run from .github
        uses: contributor-assistant/github-action@ba066dbae3769e2ce93ec8cfc4fdc51b9db628ba
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app.outputs.token }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://skale.space/cla-txt
          remote-organization-name: skalenetwork
          remote-repository-name: cla-sigs
          branch: master
          allowlist: ${{ steps.team.outputs.result }},*[bot]

      - name: Verify every author signed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_TOKEN: ${{ github.token }}
          ALLOW: ${{ steps.team.outputs.result }}
        run: |
          signed=$(gh api "repos/skalenetwork/cla-sigs/contents/signatures/version1/cla.json?ref=master" -H "Accept: application/vnd.github.raw" | jq -r '.signedContributors[].name')
          for a in $(GH_TOKEN=$PR_TOKEN gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate --jq '.[].author.login'); do
            [[ $a == *"[bot]" || ",$ALLOW," == *",$a,"* ]] || grep -qx "$a" <<<"$signed" || { echo "::error::CLA not signed by $a"; exit 1; }
          done
